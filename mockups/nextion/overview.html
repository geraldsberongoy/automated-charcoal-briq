<!doctype html><html><head><meta charset="utf-8"><title>Nextion Flow Overview</title><style>
body{margin:0;background:#05070a;font-family:'Segoe UI',Arial,sans-serif;color:#e8edf5;padding:24px;width:1272px;box-sizing:border-box}
h1{margin:0 0 4px;font-size:22px;color:#00d4aa;letter-spacing:1px} p{margin:0 0 18px;color:#9bacc8;font-size:14px}
.g{display:grid;grid-template-columns:repeat(3,400px);gap:24px 12px}
figure{margin:0} img{width:400px;height:240px;border-radius:8px;border:6px solid #1a1d24;display:block}

<h1>NEXTION 7" HMI · BATCH FLOW (800×480)</h1>
<p>One machine action at a time: exactly one motor or actuator runs per step. STOP on every running step.</p>
<div class="g">
<figure><img src="01_setup_paper_water.png"><figcaption><b>Setup 1:</b> load paper, choose water level (preset 100%)</figcaption></figure>
<figure><img src="02_setup_charcoal.png"><figcaption><b>Setup 2:</b> paper card slides left, load charcoal, START</figcaption></figure>
<figure><img src="03_water.png"><figcaption><b>1. Water:</b> solenoid only</figcaption></figure>
<figure><img src="04_mix.png"><figcaption><b>2. Mix:</b> 20V 5A mixer motor only</figcaption></figure>
<figure><img src="05_open_gate.png"><figcaption><b>3. Open gate:</b> 15cm actuator retracts only</figcaption></figure>
<figure><img src="06_pour.png"><figcaption><b>4. Pour:</b> mixer motor pulses only</figcaption></figure>
<figure><img src="07_shake.png"><figcaption><b>5. Shake:</b> mixer vibrator (ERM) only</figcaption></figure>
<figure><img src="08_close_gate.png"><figcaption><b>6. Close gate:</b> 15cm actuator extends only</figcaption></figure>
<figure><img src="09_level.png"><figcaption><b>7. Level:</b> box vibrator (ERM) only</figcaption></figure>
<figure><img src="10_press.png"><figcaption><b>8. Press:</b> 40cm actuator extends, load cell reads force</figcaption></figure>
<figure><img src="11_release.png"><figcaption><b>9. Release:</b> 40cm actuator retracts only</figcaption></figure>
<figure><img src="12_unload.png"><figcaption><b>10. Unload:</b> all off, dispense into drying container</figcaption></figure>
<figure><img src="13_stopped.png"><figcaption><b>Stop / fault:</b> all relays off, reset and retract</figcaption></figure>
</div></body></html>
